name: utd_store_desi
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 1. Routing & DI
  go_router: ^17.2.3
  get_it: ^9.2.1
  
  # 2. Networking
  dio: ^5.9.2
  
  # 2. State Management (Cubit)
  flutter_bloc: ^9.1.1
  
  # 3. Reactive Local Database - Offline First (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  
  # 4. Real-time WebSockets
  web_socket_channel: ^2.4.4
  
  # Utilities (Format Waktu)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Dev Dependencies tambahan untuk generate file (Isar)
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true